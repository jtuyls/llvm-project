if not 'AIE' in config.root.targets:
    config.unsupported = True

config.substitutions.insert(0, ('%topdown-multi', '--issue-limit=6 --aie-bottomup-cycles=0'))

# AIE1 is out of scope for the LLVM-23 port: its tests are gated behind an
# 'aie1' feature that is OFF by default. Re-enable with AIE_ENABLE_AIE1=1.
import os
if os.environ.get('AIE_ENABLE_AIE1'):
    config.available_features.add('aie1')
